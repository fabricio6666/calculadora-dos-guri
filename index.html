<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora do Guri</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculadora">

        <div class="display">
            <div id="operacao">0</div>
            <div id="resultado">0</div>
        </div>

        <div class="botoes">

            <button id="limpar" class="especial">C</button>
            <button id="apagar" class="especial">⌫</button>
            <button class="operador">%</button>
            <button class="operador">÷</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operador">×</button>

            <button>4</button>
            <button>5</button>
            <button>6</button>
            <button class="operador">−</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
            <button class="operador">+</button>

            <button class="zero">0</button>
            <button>,</button>
            <button id="igual" class="igual">=</button>

        </div>

    </main>

    <script src="script.js"></script>

</body>

</html>
